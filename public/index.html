<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shinobi Showdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png" />
  <link rel="apple-touch-icon" href="img/favicon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="leaf" src="img/konoha-orange.png" alt=""><span class="b1">SHINOBI</span> <span class="b2">SHOWDOWN</span></div>
    <span class="grow"></span>
    <span id="topinfo" class="info"></span>
    <button id="dexBtn" class="small ghost">📜 Dex</button>
    <button id="menuBtn" class="small ghost">Menu</button>
  </header>
  <main id="app"></main>
  <div id="tooltip" class="tooltip hidden"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
