<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shinobi Showdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="b1">SHINOBI</span> <span class="b2">SHOWDOWN</span></div>
    <span class="grow"></span>
    <span id="topinfo" class="info"></span>
    <button id="menuBtn" class="small ghost">Menu</button>
  </header>
  <main id="app"></main>
  <div id="tooltip" class="tooltip hidden"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
